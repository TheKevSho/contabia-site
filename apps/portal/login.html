<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231B2A4A%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia%27 font-size=%2718%27 fill=%27%23D4704A%27 text-anchor=%27middle%27 font-weight=%27bold%27%3EC%3C/text%3E%3C/svg%3E">
  <title>ContabIA — Iniciar sesión</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">Contab<span>IA</span></div>
    <div class="login-tagline">Su agente cierra sus libros.</div>
    <div class="login-role-pill">Portal del <span class="accent">Dueño</span></div>

    <div class="form-group">
      <label class="form-label">Usuario o correo</label>
      <input type="text" id="email" class="form-input" placeholder="kevin · nick · demo" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" autofocus>
    </div>

    <div id="error" class="login-error"></div>

    <button id="signin" class="btn btn-primary full-w" style="padding:12px 0; font-size:15px;">
      Iniciar sesión
    </button>

    <div class="login-divider">o</div>

    <button class="btn btn-ghost full-w" style="padding:10px 0; font-size:14px;" onclick="alert('Reenvíe documentos a su chat personal de Hermes en WhatsApp.')">
      Chat personal de Hermes
    </button>

    <div class="login-switch">
      Soy
      <a href="login-contador.html">Contador</a>·<a href="login-gerente.html">Gerente</a>
    </div>
  </div>
</div>
<script src="js/login-live.js"></script>
<script>
  (function() {
    const ROLE = 'owner';
    const REDIRECT = 'index.html';
    contabiaMaybeDemo(ROLE, REDIRECT);
    document.getElementById('signin').addEventListener('click', () => contabiaAttemptLogin({ role: ROLE, redirect: REDIRECT }));
    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') contabiaAttemptLogin({ role: ROLE, redirect: REDIRECT });
    });
  })();
</script>
</body>
</html>
