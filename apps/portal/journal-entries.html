<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231B2A4A%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Georgia%27 font-size=%2718%27 fill=%27%23D4704A%27 text-anchor=%27middle%27 font-weight=%27bold%27%3EC%3C/text%3E%3C/svg%3E">
  <title>ContabIA — Comprobantes</title>
  <link rel="stylesheet" href="css/portal.css">
  <script src="js/theme.js"></script>
  <style>
    .je-card {
      background: var(--white);
      border: 1px solid var(--light-gray);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 12px;
    }
    .je-card .head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .je-card .je-id {
      font-family: var(--font-mono); font-size: 11.5px;
      color: var(--terracotta); font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .je-card .je-title {
      font-family: var(--font-display); font-size: 19px;
      color: var(--charcoal); margin-top: 2px;
    }
    .je-card .je-desc { font-size: 13px; color: var(--warm-gray); margin-top: 4px; }
    .je-card .head-right {
      display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    }
    .je-lines { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .je-lines th, .je-lines td {
      padding: 9px 10px; font-size: 13px; text-align: left;
      border-bottom: 1px solid var(--light-gray);
    }
    .je-lines th {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--warm-gray); font-weight: 700;
    }
    .je-lines .acc { font-family: var(--font-mono); color: var(--ocean); font-weight: 600; }
    .je-lines .amt { font-family: var(--font-mono); text-align: right; font-weight: 600; }
    .je-lines .amt.dr { color: var(--charcoal); }
    .je-lines .amt.cr { color: var(--ocean); }
    .je-lines tfoot td {
      border-top: 2px solid var(--midnight); border-bottom: none;
      font-weight: 700; font-size: 13.5px;
    }
    .je-actions {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; padding-top: 12px; border-top: 1px solid var(--light-gray);
      flex-wrap: wrap;
    }
    .je-actions .meta {
      font-size: 12px; color: var(--warm-gray);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .je-actions .buttons { display: flex; gap: 8px; }
    .btn-approve {
      background: var(--success); color: var(--on-dark); border: none;
      padding: 8px 14px; border-radius: var(--radius);
      font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-reject {
      background: var(--white); color: var(--critical); border: 1px solid var(--critical);
      padding: 8px 14px; border-radius: var(--radius);
      font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .je-blocked-note {
      background: rgba(212,160,74,.10); border: 1px solid #E8C896; color: #876022;
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 13px; margin-bottom: 12px;
    }
    .je-blocked-note strong { color: var(--charcoal); }
    .live-toggle-btn {
      background: var(--white); border: 1px solid var(--terracotta); color: var(--terracotta);
      padding: 8px 14px; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .live-toggle-btn.on { background: var(--terracotta); color: var(--on-dark); }
    .live-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: var(--critical); margin-left: 10px;
    }
    .live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); }
    .live-info-panel {
      background: var(--sand); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
    }
    .live-info-panel h3 { font-size: 13px; margin: 0 0 10px; color: var(--charcoal); }
    .live-info-panel ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--charcoal); line-height: 1.7; }
    .live-info-panel .amt { font-family: var(--font-mono); color: var(--warm-gray); }
    .group-heading {
      font-size: 13px; font-weight: 700; color: var(--warm-gray);
      text-transform: uppercase; letter-spacing: 1px;
      margin: 22px 0 10px;
    }
  </style>
</head>
<body>
<div class="shell">
  <div id="sidebar-mount"></div>

  <main class="main">
    <div id="topbar-mount"></div>

    <div class="content">

      <div class="page-head">
        <div class="title-block">
          <h1>Comprobantes (JEs)</h1>
          <div class="meta" id="page-meta">…</div>
        </div>
        <div class="actions" id="page-actions">
          <button class="btn btn-secondary" onclick="location.reload()">↻ Actualizar</button>
        </div>
      </div>

      <div id="alert-slot"></div>

      <div class="filter-chips" id="je-filters"></div>

      <div id="je-list"></div>

    </div>
  </main>
</div>

<script src="js/portal.js"></script>
<script src="js/data.js"></script>
<script src="js/sonata-live.js"></script>
<script src="js/i18n.js"></script>
<script src="js/live-shell.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>

  

<script src="js/help.js"></script>
<script src="js/agent-widget.js"></script>
<script>let currentJEFilter = 'all';
let liveJEData = null;
let liveEntityId = null;

document.addEventListener('DOMContentLoaded', () => {
  const entityId = currentEntityId();
  liveEntityId = entityId;
  if (isLiveMode() && liveAvailable(entityId)) {
    initLivePage(entityId);
  } else {
    initDemoPage();
  }
});

/* ============================================================
   DEMO PATH — unchanged from the original mock-data implementation.
   ============================================================ */
function initDemoPage() {
  const e = currentEntityData();
  const meta = e.meta;
  const cs = e.closeSummary;

  document.getElementById('page-meta').innerHTML =
    `${meta.name} · ${meta.period.toLowerCase()} · ${cs.total_jes} comprobantes (${cs.jes_pending} esperan aprobación)`;

  if (cs.jes_pending > 0) {
    document.getElementById('alert-slot').innerHTML = `
      <div class="alert-banner">
        <div class="alert-text">
          <div class="icon">!</div>
          <div class="copy"><strong>${cs.jes_pending} comprobante${cs.jes_pending===1?'':'s'} esperan aprobación.</strong> Cada uno se postea a ${meta.accounting_system} sólo después de su aprobación.</div>
        </div>
      </div>`;
  }

  renderFilters(e);
  renderList(e);
}

function renderFilters(e) {
  const items = e.journalEntries;
  const counts = {
    all:      items.length,
    pending:  items.filter(x => x.status === 'pending').length,
    approved: items.filter(x => x.status === 'approved').length,
    blocked:  items.filter(x => x.status === 'blocked').length,
  };
  const chips = [
    { key: 'all',      label: t('je.filter.todos') },
    { key: 'pending',  label: t('je.filter.pendientes') },
    { key: 'approved', label: t('je.filter.aprobados') },
    { key: 'blocked',  label: t('je.filter.bloqueados') },
  ];
  document.getElementById('je-filters').innerHTML = chips.map(c => `
    <div class="filter-chip ${c.key===currentJEFilter?'active':''}"
         onclick="setJEFilter('${c.key}')">${c.label} (${counts[c.key]||0})</div>
  `).join('');
}

function setJEFilter(key) {
  currentJEFilter = key;
  const e = currentEntityData();
  renderFilters(e);
  renderList(e);
}

function renderList(e) {
  const items = currentJEFilter === 'all'
    ? e.journalEntries
    : e.journalEntries.filter(x => x.status === currentJEFilter);

  document.getElementById('je-list').innerHTML = items.length === 0
    ? `<div class="panel" style="text-align:center;color:var(--warm-gray);">${t('je.nothing_in_filter')}</div>`
    : items.map(je => renderJE(je)).join('');
}

function renderJE(je) {
  const totalDr = je.lines.reduce((s,l) => s + (l.debit  || 0), 0);
  const totalCr = je.lines.reduce((s,l) => s + (l.credit || 0), 0);
  const lines = je.lines.length === 0
    ? `<tr><td colspan="3" style="text-align:center;color:var(--warm-gray);padding:18px;">${t('je.empty_lines')}</td></tr>`
    : je.lines.map(l => `
      <tr>
        <td><span class="acc">${l.account}</span> <span style="color:var(--charcoal);">${l.name}</span></td>
        <td class="amt dr">${l.debit  ? l.debit.toLocaleString('es-CO')  : ''}</td>
        <td class="amt cr">${l.credit ? l.credit.toLocaleString('es-CO') : ''}</td>
      </tr>`).join('');
  const blockedNote = je.blocked_by
    ? `<div class="je-blocked-note"><strong>${t_fmt('je.blocked_by', {blocker: je.blocked_by.toUpperCase()})}</strong></div>`
    : '';
  const actions = je.status === 'approved'
    ? `<span style="color:var(--success);font-weight:700;">${t('je.approved_ready')}</span>`
    : je.status === 'blocked'
      ? `<span style="color:var(--warning);font-weight:700;">${t('je.blocked_status')}</span>`
      : `<button class="btn-reject" onclick="alert(t_fmt('je.demo.rejected_alert',{}))">${t('je.demo.reject_btn')}</button>
         <button class="btn-approve" onclick="alert(t_fmt('je.demo.approved_alert',{system:e_meta('accounting_system')}))">${t('je.demo.approve_btn')}</button>`;
  return `
    <div class="je-card">
      <div class="head">
        <div>
          <div class="je-id">${je.id} · ${je.subtype}</div>
          <div class="je-title">${je.title}</div>
          <div class="je-desc">${je.description}</div>
        </div>
        <div class="head-right">
          <span class="badge badge-${je.status}">${statusLabel(je.status)}</span>
          <span class="priority-badge badge-${je.priority}">${je.priority.toUpperCase()}</span>
        </div>
      </div>
      ${blockedNote}
      <table class="je-lines">
        <thead><tr><th>${t('je.table.cuenta')}</th><th style="text-align:right;">${t('je.table.debito')}</th><th style="text-align:right;">${t('je.table.credito')}</th></tr></thead>
        <tbody>${lines}</tbody>
        ${je.lines.length > 0 ? `<tfoot><tr><td>${t('je.table.total')}</td><td class="amt dr">${totalDr.toLocaleString('es-CO')}</td><td class="amt cr">${totalCr.toLocaleString('es-CO')}</td></tr></tfoot>` : ''}
      </table>
      <div class="je-actions">
        <div class="meta">
          <span>${t('je.confidence')} ${Math.round(je.ai_confidence*100)}%</span>
          <span>${t('je.created')} ${fmtDate(je.created_at)}</span>
        </div>
        <div class="buttons">${actions}</div>
      </div>
    </div>`;
}

function statusLabel(s) {
  const map = {pending:'je.status.pending',approved:'je.status.approved',rejected:'je.status.rejected',
           posted:'je.status.posted',blocked:'je.status.blocked'};
  return map[s] ? t(map[s]) : s;
}
function e_meta(k) { return currentEntityData().meta[k]; }

/* ============================================================
   LIVE PATH — Sonata Mas January 2026 proposed journal entries,
   served by apps/api. Rendered grouped (A/B/C), per apps/api/README.md's
   note that the real shape is richer than a flat journalEntries[] array
   and needs a render change, not a pure re-point.
   ============================================================ */
async function initLivePage(entityId) {
  document.getElementById('page-meta').textContent = t('je.loading');
  try {
    const [summary, jeData] = await Promise.all([
      fetchLiveSummary(entityId),
      fetchLiveJournalEntries(entityId),
    ]);
    liveJEData = jeData;
    const cfg = LIVE_CONFIG[entityId];
    const pending = jeData.items.filter(x => x.status === 'pending_edwin_approval').length;

    document.getElementById('page-meta').innerHTML =
      `${summary.meta.name} · ${cfg.period_label} <span class="live-pill"><span class="dot"></span>Datos reales</span> · ` +
      `${jeData.items.length} comprobantes propuestos (${pending} esperan a Edwin)`;

    if (pending > 0) {
      document.getElementById('alert-slot').innerHTML = `
        <div class="alert-banner">
          <div class="alert-text">
            <div class="icon">!</div>
            <div class="copy"><strong>${pending} comprobante${pending===1?'':'s'} esperan aprobación de Edwin.</strong> Nada se postea a Alegra hasta que Edwin apruebe cada uno (ver apps/api/main.py — POST de cierre deliberadamente no implementado en esta pasada).</div>
          </div>
        </div>`;
    }

    renderLiveFilters();
    renderLiveList();
  } catch (err) {
    document.getElementById('page-meta').textContent = 'Error cargando datos reales.';
    document.getElementById('alert-slot').innerHTML = `
      <div class="alert-banner crit">
        <div class="alert-text">
          <div class="icon">!</div>
          <div class="copy"><strong>No se pudo conectar con la API real</strong> (${err.message}). ¿Está corriendo apps/api en ${LIVE_CONFIG[entityId].api_base}?</div>
        </div>
      </div>`;
    console.error(err);
  }
}

function liveJEStatusClass(s) {
  return ({pending_edwin_approval: 'pending', approved_by_edwin: 'approved', rejected: 'rejected', disclosure_only: 'needs_info'})[s] || s;
}
function liveJEStatusLabel(s) {
  const map = {pending_edwin_approval: 'je.status.pending_edwin', approved_by_edwin: 'je.status.approved_edwin', rejected: 'je.status.rejected', disclosure_only: 'je.status.disclosure_only'};
  return map[s] ? t(map[s]) : s;
}

function renderLiveFilters() {
  const lang = (typeof currentLang === 'function' ? currentLang() : 'es');
  const items = liveJEData.items;
  const counts = {
    all: items.length,
    live: items.filter(x => x.bucket === 'live' || (x.period && x.period >= '2026-07')).length,
    baseline: items.filter(x => x.bucket === 'baseline' || !(x.period && x.period >= '2026-07')).length,
    pending_edwin_approval: items.filter(x => x.status === 'pending_edwin_approval').length,
    approved_by_edwin: items.filter(x => x.status === 'approved_by_edwin').length,
  };
  const chips = [
    { key: 'all', label: t('je.filter.todos') },
    { key: 'live', label: t('je.filter.julio_vivo') },
    { key: 'baseline', label: t('je.filter.linea_base_ene') },
    { key: 'pending_edwin_approval', label: t('je.filter.pendientes_edwin') },
    { key: 'approved_by_edwin', label: t('je.filter.aprobados_edwin') },
  ];
  document.getElementById('je-filters').innerHTML = chips.map(c => `
    <div class="filter-chip ${c.key===currentJEFilter?'active':''}"
         onclick="setLiveJEFilter('${c.key}')">${c.label} (${counts[c.key]||0})</div>
  `).join('');
}

function setLiveJEFilter(key) {
  currentJEFilter = key;
  renderLiveFilters();
  renderLiveList();
}

function renderLiveInfoPanels() {
  const d = liveJEData;
  const parts = [];
  if (d.open_judgment_calls.length) {
    parts.push(`
      <div class="live-info-panel">
        <h3>${t('je.panel_judgment_calls')}</h3>
        <ul>${d.open_judgment_calls.map(o => `<li><strong>${o.ref}</strong> — ${o.title} <span class="amt">(COP ${o.amount_cop.toLocaleString('es-CO')})</span> — ${o.needed}</li>`).join('')}</ul>
      </div>`);
  }
  if (d.recurring_routines.length) {
    parts.push(`
      <div class="live-info-panel">
        <h3>${t('je.panel_recurring')}</h3>
        <ul>${d.recurring_routines.map(r => `<li><strong>${r.id}</strong> — ${r.description} — ${r.status}</li>`).join('')}</ul>
      </div>`);
  }
  if (d.accepted_no_action.length) {
    parts.push(`
      <div class="live-info-panel">
        <h3>${t('je.info_accepted')}</h3>
        <ul>${d.accepted_no_action.map(a => `<li>${a}</li>`).join('')}</ul>
      </div>`);
  }
  return parts.join('');
}

function renderLiveList() {
  const items = currentJEFilter === 'all' ? liveJEData.items
    : currentJEFilter === 'live' ? liveJEData.items.filter(x => x.bucket === 'live' || (x.period && x.period >= '2026-07'))
    : currentJEFilter === 'baseline' ? liveJEData.items.filter(x => x.bucket === 'baseline' || !(x.period && x.period >= '2026-07'))
    : liveJEData.items.filter(x => x.status === currentJEFilter);

  const groupOrder = ['A_ready_to_post', 'B_estimated', 'C_disclosure_only'];
  let html = '';
  groupOrder.forEach(g => {
    const groupItems = items.filter(x => x.group === g);
    if (!groupItems.length) return;
    html += `<div class="group-heading">${JE_GROUP_LABEL[g]}</div>`;
    html += groupItems.map(je => renderLiveJECard(je)).join('');
  });
  if (!html) html = `<div class="panel" style="text-align:center;color:var(--warm-gray);">${t('je.nothing_in_filter')}</div>`;

  html += renderLiveInfoPanels();
  document.getElementById('je-list').innerHTML = html;
}

function renderLiveJECard(je) {
  const totalDr = je.lines.reduce((s,l) => s + (l.debit  || 0), 0);
  const totalCr = je.lines.reduce((s,l) => s + (l.credit || 0), 0);
  const lines = je.lines.length === 0
    ? `<tr><td colspan="3" style="text-align:center;color:var(--warm-gray);padding:18px;">${t('je.empty_lines_live')}</td></tr>`
    : je.lines.map(l => `
      <tr>
        <td><span class="acc">${l.account}</span></td>
        <td class="amt dr">${l.debit  ? l.debit.toLocaleString('es-CO')  : ''}</td>
        <td class="amt cr">${l.credit ? l.credit.toLocaleString('es-CO') : ''}</td>
      </tr>`).join('');

  const linkedNote = je.linked_exceptions.length
    ? `<div class="je-blocked-note"><strong>${t('je.linked_exceptions')}</strong> ${je.linked_exceptions.join(', ')}</div>`
    : '';

  let actions;
  if (je.group === 'C_disclosure_only') {
    actions = `<span style="color:var(--warm-gray);font-weight:700;">${t('je.disclosure_only_tag')}</span>`;
  } else if (je.status === 'approved_by_edwin') {
    actions = `<span style="color:var(--success);font-weight:700;">${t('je.approved_edwin_tag')}</span>`;
  } else if (je.status === 'rejected') {
    actions = `<span style="color:var(--critical);font-weight:700;">${t('je.rejected_tag')}${je.rejection_note ? ' — ' + je.rejection_note : ''}</span>`;
  } else {
    actions = `<button class="btn-reject" onclick="event.stopPropagation(); decideLiveJE('${je.id}','rejected')">${t('je.reject_btn')}</button>
               <button class="btn-approve" onclick="event.stopPropagation(); decideLiveJE('${je.id}','approved_by_edwin')">${t('je.approve_btn')}</button>`;
  }

  return `
    <div class="je-card" onclick="if(typeof openAgentOnItem==='function') openAgentOnItem('je', liveJEData.items.find(j=>j.id==='${je.id}'))">
      <div class="head">
        <div>
          <div class="je-id">${je.id}</div>
          <div class="je-title">${je.title}</div>
          <div class="je-desc">${je.description}</div>
        </div>
        <div class="head-right">
          <span class="badge badge-${liveJEStatusClass(je.status)}">${liveJEStatusLabel(je.status)}</span>
          <span class="priority-badge badge-${je.priority}">${je.priority.toUpperCase()}</span>
        </div>
      </div>
      ${linkedNote}
      <table class="je-lines">
        <thead><tr><th>${t('je.table.cuenta')}</th><th style="text-align:right;">${t('je.table.debito')}</th><th style="text-align:right;">${t('je.table.credito')}</th></tr></thead>
        <tbody>${lines}</tbody>
        ${je.lines.length > 0 ? `<tfoot><tr><td>${t('je.table.total')}</td><td class="amt dr">${totalDr.toLocaleString('es-CO')}</td><td class="amt cr">${totalCr.toLocaleString('es-CO')}</td></tr></tfoot>` : ''}
      </table>
      <div class="je-actions">
        <div class="meta"><span>${(je.bucket === 'live' || (je.period && je.period >= '2026-07')) ? t('je.bucket_live') : t('je.bucket_baseline')}</span></div>
        <div class="buttons">${actions}</div>
      </div>
    </div>`;
}

async function decideLiveJE(jeId, status) {
  let note = null;
  if (status === 'rejected') {
    note = prompt(t('je.reject_prompt')) || null;
  }
  try {
    await patchLiveJournalEntry(liveEntityId, jeId, status, note);
    await initLivePage(liveEntityId);
  } catch (err) {
    alert(t_fmt('je.error_save', {msg: err.message}));
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.title = t('je.page_title');
  var h1 = document.querySelector('h1');
  if (h1) h1.textContent = t('je.page_title');
});
</script>
</body>
</html>
