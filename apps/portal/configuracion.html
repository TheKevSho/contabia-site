<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContabIA — Configuración</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B2A4A'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='18' fill='%23D4704A' text-anchor='middle' font-weight='bold'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/portal.css">
  <script src="js/theme.js"></script>
  <style>
    .conf-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--light-gray);
      margin-bottom: 22px; overflow-x: auto;
    }
    .conf-tab {
      padding: 12px 18px; font-size: 13.5px; font-weight: 600;
      color: var(--warm-gray); border-bottom: 2px solid transparent;
      cursor: pointer; background: none; white-space: nowrap;
    }
    .conf-tab:hover { color: var(--charcoal); }
    .conf-tab.active { color: var(--terracotta); border-bottom-color: var(--terracotta); }

    .conf-section { display: none; }
    .conf-section.active { display: block; }

    .field-row {
      display: grid; grid-template-columns: 200px 1fr;
      gap: 14px; padding: 12px 0;
      border-bottom: 1px solid var(--light-gray);
      align-items: center;
    }
    .field-row:last-child { border-bottom: none; }
    .field-row .label {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--warm-gray); font-weight: 700;
    }
    .field-row .value {
      font-size: 14.5px; color: var(--charcoal); font-weight: 500;
    }
    .field-row .value.mono { font-family: var(--font-mono); }

    .conn-card {
      background: var(--white); border: 1px solid var(--light-gray);
      border-radius: var(--radius-lg); padding: 16px 20px;
      margin-bottom: 10px; display: flex;
      justify-content: space-between; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .conn-card .left { display: flex; align-items: center; gap: 14px; }
    .conn-card .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--success); box-shadow: 0 0 0 4px rgba(74,139,111,.15);
    }
    .conn-card .dot.warn { background: var(--warning); box-shadow: 0 0 0 4px rgba(212,160,74,.18); }
    .conn-card .dot.fail { background: var(--critical); box-shadow: 0 0 0 4px rgba(196,74,58,.18); }
    .conn-card .name { font-family: var(--font-display); font-size: 17px; color: var(--charcoal); }
    .conn-card .sync { font-size: 12px; color: var(--warm-gray); margin-top: 2px; font-family: var(--font-mono); }

    .rule-card {
      background: var(--white); border: 1px solid var(--light-gray);
      border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px;
      display: grid; grid-template-columns: auto 1fr auto;
      gap: 14px; align-items: center;
    }
    .rule-toggle {
      width: 38px; height: 22px; background: var(--light-gray);
      border-radius: 11px; position: relative; cursor: pointer;
      transition: background .15s ease;
    }
    .rule-toggle.on { background: var(--success); }
    .rule-toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; background: var(--white);
      border-radius: 50%; transition: left .15s ease;
    }
    .rule-toggle.on::after { left: 18px; }
    .rule-when { font-family: var(--font-mono); font-size: 12.5px; color: var(--ocean); margin-bottom: 3px; font-weight: 600; }
    .rule-action { font-size: 13.5px; color: var(--charcoal); }
    .rule-meta { font-size: 11px; color: var(--warm-gray); margin-top: 4px; }
    .rule-tag {
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 8px; border-radius: 10px; font-weight: 700;
      background: var(--sand); color: var(--charcoal);
    }

    .team-row {
      display: grid; grid-template-columns: 38px 1fr auto auto;
      gap: 14px; align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--light-gray);
    }
    .team-row:last-child { border-bottom: none; }
    .team-row .av {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--terracotta); color: var(--on-dark);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .team-row .name { font-weight: 600; color: var(--charcoal); font-size: 14px; }
    .team-row .email { font-size: 12px; color: var(--warm-gray); }
    .team-row .role { font-size: 11.5px; padding: 4px 10px; border-radius: 10px; background: var(--sand); color: var(--charcoal); font-weight: 700; letter-spacing: .8px; text-transform: uppercase; font-family: var(--font-mono); }
    .team-row .login { font-size: 11.5px; color: var(--warm-gray); font-family: var(--font-mono); }

    .notif-table { width: 100%; border-collapse: collapse; }
    .notif-table th, .notif-table td {
      padding: 11px 12px; font-size: 13px; text-align: left;
      border-bottom: 1px solid var(--light-gray);
    }
    .notif-table th {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--warm-gray); font-weight: 700;
    }
    .notif-table .check { font-family: var(--font-mono); font-weight: 700; }
    .notif-table .check.yes { color: var(--success); }
    .notif-table .check.no  { color: var(--warm-gray); opacity: .4; }
  </style>
</head>
<body>
<div class="shell">
  <div id="sidebar-mount"></div>

  <main class="main">
    <div id="topbar-mount"></div>

    <div class="content">

      <div class="page-head">
        <div class="title-block">
          <h1>Configuración</h1>
          <div class="meta" id="page-meta">…</div>
        </div>
      </div>

      <div class="conf-tabs" id="conf-tabs">
        <button class="conf-tab active" data-tab="entidad">Entidad</button>
        <button class="conf-tab" data-tab="conectores">Conectores</button>
        <button class="conf-tab" data-tab="reglas">Reglas del contador</button>
        <button class="conf-tab" data-tab="otas">OTAs</button>
        <button class="conf-tab" data-tab="equipo">Equipo</button>
        <button class="conf-tab" data-tab="notif">Notificaciones</button>
      </div>

      <div class="conf-section active" id="sec-entidad"></div>
      <div class="conf-section" id="sec-conectores"></div>
      <div class="conf-section" id="sec-reglas"></div>
      <div class="conf-section" id="sec-otas"></div>
      <div class="conf-section" id="sec-equipo"></div>
      <div class="conf-section" id="sec-notif"></div>

    </div>
  </main>
</div>


  

<script src="js/data.js"></script>
<script src="js/sonata-live.js"></script>
<script src="js/i18n.js"></script>
<script src="js/live-shell.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script src="js/help.js"></script>
<script src="js/agent-widget.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const live = typeof isLiveMode === 'function' && isLiveMode();
  if (live) {
    renderLiveConfig();
    return;
  }
  renderDemoConfig();
});

function renderDemoConfig() {
  const e = currentEntityData();
  const meta = e.meta;

  document.getElementById('page-meta').innerHTML =
    `${meta.name} · ${meta.legal_name} · NIT ${meta.nit}`;

  /* Entidad */
  document.getElementById('sec-entidad').innerHTML = `
    <div class="panel">
      ${field('Razón social',     meta.legal_name)}
      ${field('Nombre comercial', meta.name)}
      ${field('NIT',              meta.nit, true)}
      ${field('Régimen tributario','Responsable de IVA · Régimen ordinario')}
      ${field('Municipio ICA',    'Santa Marta · 5,5 × 1.000')}
      ${field('Sistema contable', meta.accounting_system)}
      ${field('PMS',              meta.pms)}
      ${field('Banco principal',  meta.bank_primary)}
      ${field('Periodo activo',   meta.period)}
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;">
      <button class="btn btn-secondary" onclick="alert('Edición bloqueada en mockup. Cambios pasan por Angel.')">Editar datos</button>
    </div>`;

  /* Conectores */
  document.getElementById('sec-conectores').innerHTML = e.connectors.map(c => `
    <div class="conn-card">
      <div class="left">
        <span class="dot ${c.status==='ok'?'':c.status}"></span>
        <div>
          <div class="name">${c.name}</div>
          <div class="sync">Última sincronización: ${c.last_sync}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="syncConn()">Sincronizar ahora</button>
        ${c.status === 'ok' ? '' : '<button class="btn btn-primary" onclick="reconnectConn()">Reconectar</button>'}
      </div>
    </div>`).join('');

  /* Reglas */
  const rules = e.config.rules_client;
  document.getElementById('sec-reglas').innerHTML = `
    <div style="margin-bottom:14px;font-size:13.5px;color:var(--charcoal);">
      Reglas que el contador autoriza para este cliente. Se ejecutan en cada cierre.
      <strong>${rules.filter(r=>r.enabled).length} activas</strong> de ${rules.length}.
    </div>
    ${rules.map(r => `
      <div class="rule-card">
        <div class="rule-toggle ${r.enabled?'on':''}" onclick="this.classList.toggle('on')"></div>
        <div>
          <div class="rule-when">${r.when}</div>
          <div class="rule-action">${r.action}</div>
          <div class="rule-meta">${r.hits_30d} hit${r.hits_30d===1?'':'s'} en 30d · autor: ${r.author}</div>
        </div>
        <span class="rule-tag">${r.type}</span>
      </div>`).join('')}
    <div style="margin-top:14px;">
      <button class="btn btn-secondary" onclick="alert('Editor de reglas (próximamente).')">+ Nueva regla</button>
    </div>
    <div style="margin-top:24px;padding:14px 18px;background:var(--cream);border-radius:8px;font-size:13px;color:var(--warm-gray);">
      <strong style="color:var(--charcoal);">Reglas del sistema</strong> (ley tributaria, USALI, conectores) — read-only, no editables. Transparencia, no opinión.
    </div>`;

  /* OTAs */
  document.getElementById('sec-otas').innerHTML = `
    <div class="panel" style="padding:0;">
      <table class="data-table">
        <thead><tr><th>Canal</th><th>Modelo</th><th class="text-right">Reservas mes</th><th class="text-right">Comisión mes</th></tr></thead>
        <tbody>
          ${e.ota_breakdown.map(o => `
            <tr>
              <td>
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="badge-square ${o.cls}" style="width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--on-dark);font-weight:700;font-size:11px;font-family:var(--font-mono);">${o.code}</span>
                  <strong style="color:var(--charcoal);">${o.name}</strong>
                </div>
              </td>
              <td>${o.model}</td>
              <td class="text-right mono">${o.reservas}</td>
              <td class="text-right mono">${o.commission === 0 ? '—' : o.commission.toLocaleString('es-CO')}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  /* Equipo */
  document.getElementById('sec-equipo').innerHTML = `
    <div class="panel">
      ${e.config.team.map(u => `
        <div class="team-row">
          <div class="av">${u.name.split(' ').map(p=>p[0]).slice(0,2).join('')}</div>
          <div>
            <div class="name">${u.name}</div>
            <div class="email">${u.email}</div>
          </div>
          <span class="role">${u.role}</span>
          <span class="login">Último acceso: ${u.last_login}</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-secondary" onclick="alert('Invitar nuevo miembro (mockup).')">+ Invitar miembro</button>
    </div>`;

  /* Notificaciones */
  document.getElementById('sec-notif').innerHTML = `
    <div class="panel" style="padding:0;">
      <table class="notif-table">
        <thead><tr><th>Evento</th><th style="text-align:center;">Email</th><th style="text-align:center;">WhatsApp</th><th>Destinatarios</th></tr></thead>
        <tbody>
          ${e.config.notifications.map(n => `
            <tr>
              <td>${n.event}</td>
              <td style="text-align:center;"><span class="check ${n.email?'yes':'no'}">${n.email?'✓':'—'}</span></td>
              <td style="text-align:center;"><span class="check ${n.whatsapp?'yes':'no'}">${n.whatsapp?'✓':'—'}</span></td>
              <td>${n.recipients}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;

  /* Tab switching */
  document.querySelectorAll('.conf-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.conf-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.conf-section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('sec-' + tab.dataset.tab).classList.add('active');
    });
  });
}

function bindConfTabs() {
  document.querySelectorAll('.conf-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.conf-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.conf-section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('sec-' + tab.dataset.tab).classList.add('active');
    });
  });
}

function renderLiveConfig() {
  const e = currentEntityData();
  const meta = e.meta;
  document.getElementById('page-meta').innerHTML =
    `${meta.name} · ${meta.legal_name} · NIT ${meta.nit}`;

  document.getElementById('sec-entidad').innerHTML = `
    <div class="panel">
      ${field('Razón social',     meta.legal_name)}
      ${field('Nombre comercial', meta.name)}
      ${field('NIT',              meta.nit, true)}
      ${field('Régimen tributario','Responsable de IVA · Régimen ordinario')}
      ${field('Municipio ICA',    'Santa Marta · 5,5 × 1.000')}
      ${field('Sistema contable', meta.accounting_system || 'Alegra')}
      ${field('PMS',              meta.pms || 'FareHarbor')}
      ${field('Banco principal',  meta.bank_primary || 'Bancolombia')}
      ${field('Periodo activo',   'Julio 2026 · EN CURSO')}
    </div>`;

  document.getElementById('sec-conectores').innerHTML = (e.connectors || []).map(c => `
    <div class="conn-card">
      <div class="left">
        <span class="dot ${c.status==='ok'?'':c.status}"></span>
        <div>
          <div class="name">${c.name}</div>
          <div class="sync">Última sincronización: ${c.last_sync}</div>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('sec-otas').innerHTML = `
    <div class="panel" style="padding:18px;color:var(--warm-gray);font-size:13.5px;">
      Desglose OTA de julio aún no está cableado a un endpoint. No se muestran cifras de demostración.
    </div>`;

  document.getElementById('sec-equipo').innerHTML = `
    <div class="panel">
      <div class="team-row">
        <div class="av">KC</div>
        <div><div class="name">Kevin Carey</div><div class="email">kevin</div></div>
        <span class="role">owner</span>
      </div>
      <div class="team-row">
        <div class="av">EM</div>
        <div><div class="name">Edwin Montenegro</div><div class="email">edwin</div></div>
        <span class="role">accountant</span>
      </div>
      <div class="team-row">
        <div class="av">NG</div>
        <div><div class="name">Nicolás Giraldo</div><div class="email">nick</div></div>
        <span class="role">manager</span>
      </div>
    </div>`;

  document.getElementById('sec-notif').innerHTML = `
    <div class="panel" style="padding:18px;color:var(--warm-gray);font-size:13.5px;">
      Notificaciones: reenvíe documentos a su chat personal de Hermes en WhatsApp.
    </div>`;

  bindConfTabs();
  renderLiveRules('sonata-001');
}

function field(label, value, mono) {
  return `
    <div class="field-row">
      <div class="label">${label}</div>
      <div class="value ${mono?'mono':''}">${value}</div>
    </div>`;
}

function syncConn()      { alert('Sincronización forzada (mockup).'); }
function reconnectConn() { alert('Reautenticación abierta (mockup).'); }

/* ================= LIVE company-config rules ================= */

async function renderLiveRules(entityId) {
  const sec = document.getElementById('sec-reglas');
  try {
    const rules = await fetchLiveRules(entityId);
    const cat = c => c ? `<span class="rule-tag">${c}</span>` : '';
    const src = s => s === 'motor_fix'
      ? '<span class="rule-tag" style="background:var(--sand);">regla global (motor)</span>'
      : '<span class="rule-tag">regla del cliente</span>';
    sec.innerHTML = `
      <div style="margin-bottom:14px;font-size:13.5px;color:var(--charcoal);">
        Reglas de configuración de la empresa — <strong>datos reales</strong>.
        Se aplican en cada cierre; el motor nunca vuelve a preguntar lo que ya está aquí.
        <strong>${rules.length} activa${rules.length===1?'':'s'}</strong>.
      </div>
      ${rules.length === 0 ? `
        <div style="padding:18px;background:var(--cream);border-radius:8px;font-size:13.5px;color:var(--warm-gray);">
          Aún no hay reglas registradas. Cada decisión repetible (categorización de un
          proveedor, tratamiento de comisiones, centro de costos por defecto) se guarda
          aquí una sola vez.
        </div>` : rules.map(r => `
        <div class="rule-card">
          <div class="rule-toggle on" data-rule="${r.rule_id}" onclick="toggleLiveRule('${entityId}','${r.rule_id}', this)"></div>
          <div>
            <div class="rule-when">${r.rule_text}</div>
            <div class="rule-meta">${r.rule_id} · ${(r.created_at||'').slice(0,10)} · autor: ${r.created_by||'portal'}${r.linked_exception_id ? ' · excepción: '+r.linked_exception_id : ''}</div>
          </div>
          <div>${cat(r.category)} ${src(r.source)}</div>
        </div>`).join('')}
      <div style="margin-top:18px;" class="panel">
        <div style="font-weight:700;font-size:14px;margin-bottom:10px;color:var(--charcoal);">+ Nueva regla</div>
        <div class="form-group">
          <textarea id="new-rule-text" class="form-input" rows="2"
            placeholder="Ej.: Las facturas de Inversiones Marina Turística llevan centro de costos según el muelle/embarcación indicado en la descripción."></textarea>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <select id="new-rule-cat" class="form-input" style="max-width:200px;">
            <option value="categorization">Categorización</option>
            <option value="retention">Retenciones</option>
            <option value="cost_center">Centro de costos</option>
            <option value="banking">Bancos / pagos</option>
            <option value="payroll">Nómina</option>
            <option value="account_map">Mapeo de cuentas (posting)</option>
            <option value="other">Otra</option>
          </select>
          <input id="new-rule-exc" class="form-input" style="max-width:180px;" placeholder="Excepción (opcional): EX-J07-08">
          <button class="btn btn-primary" onclick="saveLiveRule('${entityId}')">Guardar regla</button>
          <span id="rule-save-msg" style="font-size:12.5px;color:var(--warm-gray);"></span>
        </div>
      </div>
      <div style="margin-top:24px;padding:14px 18px;background:var(--cream);border-radius:8px;font-size:13px;color:var(--warm-gray);">
        <strong style="color:var(--charcoal);">Reglas del sistema</strong> (ley tributaria, USALI, conectores) — read-only, no editables.
      </div>`;
  } catch (err) {
    sec.insertAdjacentHTML('afterbegin',
      `<div style="padding:12px 16px;margin-bottom:12px;background:var(--cream);border-left:3px solid var(--warning);font-size:13px;">
         Modo en vivo: no se pudo cargar reglas reales (${err.message}). Mostrando mockup.
       </div>`);
  }
}

async function saveLiveRule(entityId) {
  const text = document.getElementById('new-rule-text').value.trim();
  const msg = document.getElementById('rule-save-msg');
  if (!text) { msg.textContent = 'Escribe la regla primero.'; return; }
  msg.textContent = 'Guardando…';
  try {
    await createLiveRule(entityId, text,
      document.getElementById('new-rule-cat').value,
      'client_choice',
      document.getElementById('new-rule-exc').value.trim() || null);
    renderLiveRules(entityId);
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
  }
}

async function toggleLiveRule(entityId, ruleId, el) {
  const nowOn = !el.classList.contains('on');
  el.classList.toggle('on');
  try {
    await patchLiveRule(entityId, ruleId, { active: nowOn });
    if (!nowOn) renderLiveRules(entityId);  // deactivated rules drop off the active list
  } catch (err) {
    el.classList.toggle('on');  // revert on failure
    alert('No se pudo actualizar la regla: ' + err.message);
  }
}
</script>
</body>
</html>
