# ── Business Profile Config (Railway Gateway) ──────────────────────────
model:
  default: deepseek/deepseek-v4-flash
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  context_length: 64000
  api_mode: chat_completions

database:
  journal_mode: wal

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium

terminal:
  backend: none

web:
  backend: ddgs
  use_gateway: false

browser:
  use_gateway: false

compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false

prompt_caching:
  cache_ttl: 5m

display:
  compact: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

delegation:
  max_iterations: 50

platforms:
  api_server:
    enabled: false
  whatsapp:
    enabled: false

skills:
  creation_nudge_interval: 15

session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

_config_version: 34